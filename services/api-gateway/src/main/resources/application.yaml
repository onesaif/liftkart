spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**, /api/categories/**
              filters:
                - StripPrefix=0
            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=0
            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/orders/**, /api/addresses/**
              filters:
                - StripPrefix=0
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0
            - id: analytics-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/analytics/**
              filters:
                - StripPrefix=0

server:
  port: 8080

logging:
  level:
    com.liftkart: DEBUG