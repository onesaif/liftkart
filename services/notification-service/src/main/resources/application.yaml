spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/liftkart_notification_db
    username: ${DB_USER:liftkart}
    password: ${DB_PASS:liftkart123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3

server:
  port: 8085

app:
  rabbitmq:
    queues:
      order-notification: liftkart.order.notification
      vendor-approved: liftkart.vendor.approved
      vendor-rejected: liftkart.vendor.rejected
      low-stock: liftkart.product.lowstock

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.liftkart: DEBUG
    org.flywaydb: INFO