spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/liftkart_cart_db
    username: ${DB_USER:liftkart}
    password: ${DB_PASS:liftkart123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

app:
  rabbitmq:
    exchanges:
      cart: liftkart.cart.exchange
    queues:
      cart-checkout: liftkart.cart.checkout
    routing-keys:
      cart-checkout: liftkart.cart.checkout.key

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.liftkart: DEBUG
    org.flywaydb: INFO