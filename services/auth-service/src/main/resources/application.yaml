spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/liftkart_auth_db
    username: ${DB_USER:liftkart}
    password: ${DB_PASS:liftkart123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:liftkart-super-secret-key-min-256-bits-change-in-production}
    access-token-expiry: 86400000
    refresh-token-expiry: 604800000
  rabbitmq:
    exchanges:
      auth: liftkart.auth.exchange
    queues:
      vendor-approved: liftkart.vendor.approved
      vendor-rejected: liftkart.vendor.rejected
    routing-keys:
      vendor-approved: liftkart.vendor.approved.key
      vendor-rejected: liftkart.vendor.rejected.key

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.liftkart: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO