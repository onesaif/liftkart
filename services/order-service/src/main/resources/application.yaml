spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/liftkart_order_db
    username: ${DB_USER:liftkart}
    password: ${DB_PASS:liftkart123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8084

app:
  rabbitmq:
    exchanges:
      order: liftkart.order.exchange
    queues:
      order-notification: liftkart.order.notification
      order-inventory: liftkart.order.inventory
    routing-keys:
      order-notification: liftkart.order.notification.key
      order-inventory: liftkart.order.inventory.key
  kafka:
    topics:
      order-events: liftkart.order.events

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.liftkart: DEBUG
    org.flywaydb: INFO